<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Broad Street Exchange</title>
  <meta name="description" content="A simulated US market: 552 stocks, ETFs, options, bonds, futures, FX and crypto, with margin, short selling and a macro economy that moves prices.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0b0b'/%3E%3Cpath d='M7 21l5-6 4 3 9-10' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/sim.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <div class="brand">
        <div class="logo" aria-hidden="true">BSX</div>
        <div class="name"><b>Broad Street Exchange</b><span>Simulated US market</span></div>
      </div>
      <div class="clock">
        <span class="when" id="clock-when">—</span>
        <span class="status" id="clock-status"><i></i>—</span>
      </div>
      <div class="transport" role="group" aria-label="Clock controls">
        <button type="button" class="play" id="play" aria-label="Play">▶</button>
        <select id="speed" aria-label="Clock speed"></select>
        <button type="button" id="step" title="Advance 15 minutes (.)">+15m</button>
        <button type="button" id="nextday" title="Run to the next close (N)">Next close</button>
        <button type="button" id="week" title="Run five trading days">+1 wk</button>
        <button type="button" id="month" title="Run 21 trading days">+1 mo</button>
      </div>
      <div class="search">
        <input id="search" type="search" placeholder="Search 700+ symbols  /" autocomplete="off" aria-label="Search symbols">
        <div class="results" id="search-results" hidden></div>
      </div>
      <div class="acct">
        <span class="status alert-pill" id="margin-flag" hidden></span>
        <div class="stat"><span>Net liq.</span><b id="nlv">—</b></div>
        <div class="stat"><span>Today</span><b id="daypnl">—</b></div>
        <div class="stat"><span>Buying power</span><b id="bp">—</b></div>
        <button type="button" id="settings">Settings</button>
        <button type="button" id="theme" aria-label="Toggle light or dark theme">◐</button>
      </div>
    </div>
  </header>

  <nav class="tabs" aria-label="Sections">
    <div class="wrap tabs-row">
      <div class="mini" aria-label="Clock">
        <button type="button" class="play" id="mini-play" aria-label="Play">▶</button>
        <span class="mono small" id="mini-clock">—</span>
      </div>
      <div class="tab-links" id="nav"></div>
    </div>
  </nav>

  <main>
    <div class="wrap" id="view"></div>
  </main>

  <footer>
    <div class="wrap">
      Broad Street Exchange is a simulation. Every company, coin, bond issuer and headline is fictional, and prices are generated by a model, not taken from real markets. Nothing here is investment advice.
    </div>
  </footer>

  <div id="toasts" aria-live="polite"></div>
  <div id="tooltip"></div>
  <div class="loading" id="loading"><div class="box"><div class="spinner"></div><div id="loading-text">Loading…</div></div></div>

  <script src="js/core/rng.js"></script>
  <script src="js/core/calendar.js"></script>
  <script src="js/core/pricing.js"></script>
  <script src="js/core/universe.js"></script>
  <script src="js/core/economy.js"></script>
  <script src="js/core/events.js"></script>
  <script src="js/core/market.js"></script>
  <script src="js/core/options.js"></script>
  <script src="js/core/broker.js"></script>
  <script src="js/core/sim.js"></script>
  <script src="js/ui/util.js"></script>
  <script src="js/ui/charts.js"></script>
  <script src="js/ui/app.js"></script>
  <script src="js/ui/trade.js"></script>
  <script src="js/ui/views/markets.js"></script>
  <script src="js/ui/views/stocks.js"></script>
  <script src="js/ui/views/options.js"></script>
  <script src="js/ui/views/bonds.js"></script>
  <script src="js/ui/views/crypto.js"></script>
  <script src="js/ui/views/derivs.js"></script>
  <script src="js/ui/views/portfolio.js"></script>
  <script src="js/ui/views/orders.js"></script>
  <script src="js/ui/views/economy.js"></script>
  <script src="js/ui/views/guide.js"></script>
  <script src="js/ui/settings.js"></script>
  <script>BSX.UI.App.boot();</script>
</body>
</html>
